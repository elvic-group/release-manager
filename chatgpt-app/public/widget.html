<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Release Manager</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px; color: #f8f5ed; background: transparent; }
      main { max-width: 620px; margin: auto; padding: 22px; border-radius: 8px; background: linear-gradient(145deg, #151515, #080808); border: 1px solid #4e401f; box-shadow: 0 18px 50px #0004; }
      .brand { color: #f4b51c; font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 8px 0 4px; font-size: 25px; line-height: 1.15; }
      .sub { margin: 0 0 18px; color: #bbb5aa; font-size: 14px; }
      .score { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; border: 7px solid #f4b51c; font-size: 19px; font-weight: 900; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .actions { display: grid; gap: 8px; margin: 18px 0; }
      .action, .phase { padding: 11px 13px; border-radius: 6px; background: #ffffff0d; border: 1px solid #ffffff14; }
      .action { border-left: 3px solid #f4b51c; }
      .action p { margin: 7px 0 0; color: #d8d2c8; font-size: 13px; line-height: 1.45; }
      .action .meta { color: #aaa397; font-size: 12px; }
      .resources { margin-top: 18px; }
      .resources a { color: #f4d88d; }
      .resources li { margin: 6px 0; }
      .phases { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
      .phase { padding: 8px 4px; text-align: center; color: #9b958b; font-size: 11px; }
      .phase.current { color: #151008; background: #f4b51c; font-weight: 800; }
      .phase.complete { color: #f4d88d; border-color: #8b6a1f; }
      .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      h2 { margin: 0 0 8px; font-size: 14px; }
      ul { margin: 0; padding-left: 18px; color: #d8d2c8; font-size: 13px; }
      .note { margin-top: 16px; color: #9d978c; font-size: 11px; line-height: 1.4; }
      .content-pack { display: grid; gap: 14px; margin-top: 16px; }
      .content-section { padding: 13px; border-radius: 6px; background: #ffffff0d; border: 1px solid #ffffff14; }
      .content-section h2 { color: #f4d88d; }
      .copy-field { margin-top: 10px; }
      .copy-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .copy-field strong, .field-label { display: block; color: #f8f5ed; font-size: 12px; }
      .copy-field p, .field-value { margin: 5px 0 0; white-space: pre-wrap; color: #d8d2c8; font-size: 13px; line-height: 1.45; }
      .copy-btn { flex: 0 0 auto; padding: 5px 8px; border: 1px solid #74602f; border-radius: 4px; color: #f4d88d; background: #ffffff0d; font: inherit; font-size: 11px; cursor: pointer; }
      .copy-btn:hover { background: #f4b51c22; }
      .copy-btn:focus-visible { outline: 2px solid #f4d88d; outline-offset: 2px; }
      .field { margin-top: 9px; padding-top: 9px; border-top: 1px solid #ffffff12; }
      .field:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
      .field-meta { color: #aaa397; font-size: 11px; }
      .confirm { border-left: 3px solid #cf8d45; }
      [hidden] { display: none !important; }
      @media (max-width: 480px) { .phases { grid-template-columns: repeat(4, 1fr); } .lists { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Music Release Manager</div>
      <div class="row">
        <div>
          <h1 id="title">Your music release plan</h1>
          <p class="sub" id="subtitle">Waiting for release details</p>
        </div>
        <div class="score" id="score" hidden>0%</div>
      </div>
      <div class="actions" id="actions"></div>
      <section class="content-pack" id="contentPack" hidden></section>
      <div class="phases" id="phases"></div>
      <section class="resources" id="resources" hidden>
        <h2>Norwegian starting points</h2>
        <ul id="resourceList"></ul>
      </section>
      <div class="lists" id="lists" hidden>
        <section><h2>Ready</h2><ul id="ready"></ul></section>
        <section><h2>Missing</h2><ul id="missing"></ul></section>
      </div>
      <div class="note" id="note">Planning only—nothing is published, sent, submitted, or charged.</div>
    </main>
    <script type="module">
      let output = window.openai?.toolOutput ?? null;
      const byId = (id) => document.getElementById(id);
      const list = (items) => (items || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const fieldLabels = {
        en: {
          shortBio: "Short bio", longBio: "Long bio", releaseDescription: "Release description",
          editorialPitch: "Editorial pitch", pressRelease: "Press release", pressEmailSubject: "Press email subject",
          pressEmailBody: "Press email body", youtubeDescription: "YouTube description",
        },
        no: {
          shortBio: "Kort artistbio", longBio: "Lang artistbio", releaseDescription: "Utgivelsesbeskrivelse",
          editorialPitch: "Redaksjonell pitch", pressRelease: "Pressemelding", pressEmailSubject: "Emne for presse-e-post",
          pressEmailBody: "Presse-e-post", youtubeDescription: "YouTube-beskrivelse",
        },
      };
      const renderCopyFields = (content, language, copyLabel) => Object.entries(content || {})
        .filter(([, value]) => value)
        .map(([key, value]) => `<div class="copy-field"><div class="copy-head"><strong>${escapeHtml(fieldLabels[language][key] || key)}</strong><button class="copy-btn" type="button" data-copy="${escapeHtml(value)}" data-copy-label="${escapeHtml(copyLabel)}">${escapeHtml(copyLabel)}</button></div><p>${escapeHtml(value)}</p></div>`)
        .join("");
      const renderFieldValues = (fields, copyLabel) => (fields || []).map((field) => `<div class="field"><div class="copy-head"><span class="field-meta">${escapeHtml(field.form)}</span><button class="copy-btn" type="button" data-copy="${escapeHtml(field.value)}" data-copy-label="${escapeHtml(copyLabel)}">${escapeHtml(copyLabel)}</button></div><strong class="field-label">${escapeHtml(field.label)}</strong><p class="field-value">${escapeHtml(field.value)}</p></div>`).join("");

      function render() {
        if (!output) return;
        byId("resources").hidden = output.kind !== "norway-support-plan";
        byId("contentPack").hidden = output.kind !== "artist-content-pack";

        if (output.kind === "artist-content-pack") {
          const norwegian = /norwegian|norsk|bokm[aå]l|nynorsk/i.test(output.language || "");
          const locale = norwegian ? "no" : "en";
          const copyLabel = norwegian ? "Kopier" : "Copy";
          byId("title").textContent = `${output.artist || "Artist"} — ${output.releaseTitle || (norwegian ? "Artistinnhold" : "Artist content")}`;
          byId("subtitle").textContent = [output.language, output.releaseDate].filter(Boolean).join(" · ");
          byId("score").hidden = true;
          byId("lists").hidden = true;
          byId("phases").hidden = true;
          byId("actions").innerHTML = "";
          const social = (output.socialCaptions || []).map((item) => `<div class="copy-field"><div class="copy-head"><strong>${escapeHtml(item.platform)}</strong><button class="copy-btn" type="button" data-copy="${escapeHtml(item.content)}" data-copy-label="${copyLabel}">${copyLabel}</button></div><p>${escapeHtml(item.content)}</p></div>`).join("");
          const videos = (output.shortVideoIdeas || []).map((item) => {
            const hook = norwegian ? "Startkrok" : "Hook";
            const shots = norwegian ? "Klipp" : "Shots";
            const callToAction = norwegian ? "Oppfordring" : "CTA";
            const copyText = `${item.platform} — ${item.concept}\n${hook}: ${item.openingHook}\n${shots}: ${(item.shotList || []).join("; ")}\n${callToAction}: ${item.callToAction}`;
            return `<div class="field"><div class="copy-head"><strong class="field-label">${escapeHtml(item.platform)} — ${escapeHtml(item.concept)}</strong><button class="copy-btn" type="button" data-copy="${escapeHtml(copyText)}" data-copy-label="${copyLabel}">${copyLabel}</button></div><p class="field-value"><strong>${hook}:</strong> ${escapeHtml(item.openingHook)}<br><strong>${shots}:</strong> ${escapeHtml((item.shotList || []).join(" · "))}<br><strong>${callToAction}:</strong> ${escapeHtml(item.callToAction)}</p></div>`;
          }).join("");
          const images = (output.imageConcepts || []).map((item) => {
            const promptLabel = norwegian ? "Kopier prompt" : "Copy prompt";
            const avoid = norwegian ? "Unngå" : "Avoid";
            return `<div class="field"><div class="copy-head"><strong class="field-label">${escapeHtml(item.purpose)} · ${escapeHtml(item.format)}</strong><button class="copy-btn" type="button" data-copy="${escapeHtml(item.prompt)}" data-copy-label="${promptLabel}">${promptLabel}</button></div><p class="field-value">${escapeHtml(item.prompt)}${item.textOverlay ? `<br><strong>${norwegian ? "Tekst" : "Text"}:</strong> ${escapeHtml(item.textOverlay)}` : ""}<br><strong>${avoid}:</strong> ${escapeHtml((item.exclusions || []).join(" · "))}</p></div>`;
          }).join("");
          const forms = renderFieldValues(output.formFields, copyLabel);
          const confirmations = (output.confirmBeforeUse || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
          byId("contentPack").innerHTML = `
            ${output.content && Object.keys(output.content).length ? `<section class="content-section"><h2>${norwegian ? "Tekst" : "Copy"}</h2>${renderCopyFields(output.content, locale, copyLabel)}</section>` : ""}
            ${social ? `<section class="content-section"><h2>${norwegian ? "Sosiale medier" : "Social captions"}</h2>${social}</section>` : ""}
            ${videos ? `<section class="content-section"><h2>${norwegian ? "Kortvideoer" : "Short-video ideas"}</h2>${videos}</section>` : ""}
            ${images ? `<section class="content-section"><h2>${norwegian ? "Bildebrief og prompt" : "Image briefs and prompts"}</h2>${images}</section>` : ""}
            ${forms ? `<section class="content-section"><h2>${norwegian ? "Skjemafelt" : "Form fields"}</h2>${forms}</section>` : ""}
            ${confirmations ? `<section class="content-section confirm"><h2>${norwegian ? "Bekreft før bruk" : "Confirm before use"}</h2><ul>${confirmations}</ul></section>` : ""}`;
          byId("note").textContent = output.safetyNote || "Review factual claims, rights, links and permissions before use. Nothing has been submitted.";
          return;
        }

        if (output.kind === "norway-support-plan") {
          byId("title").textContent = output.artistName || "Artist project";
          byId("subtitle").textContent = [output.area, output.artistRole, output.projectFocus].filter(Boolean).join(" · ");
          byId("score").hidden = true;
          byId("lists").hidden = true;
          byId("phases").hidden = true;
          byId("actions").innerHTML = (output.nextActions || []).map((item) => `<article class="action"><strong>${item.priority}. ${escapeHtml(item.title)}</strong><p>${escapeHtml(item.action)}</p><p><strong>Why:</strong> ${escapeHtml(item.why)}</p><p class="meta"><strong>Check with:</strong> ${escapeHtml(item.verifyWith)}</p></article>`).join("");
          byId("resourceList").innerHTML = (output.resources || []).map((item) => `<li><a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.name)}</a> — ${escapeHtml(item.use)}</li>`).join("");
          byId("note").textContent = output.currentInfoNote || "Check current deadlines, eligibility and costs with the official funder.";
          return;
        }

        byId("title").textContent = `${output.artist} — ${output.title}`;
        byId("subtitle").textContent = `${output.releaseType ? output.releaseType.toUpperCase() + " · " : ""}${output.releaseDate}`;
        byId("note").textContent = output.safetyNote || byId("note").textContent;

        if (output.kind === "plan") {
          byId("score").hidden = true;
          byId("lists").hidden = true;
          byId("phases").hidden = false;
          byId("actions").innerHTML = (output.nextActions || []).map((item, index) => `<div class="action"><strong>${index + 1}.</strong> ${escapeHtml(item)}</div>`).join("");
          byId("phases").innerHTML = (output.phases || []).map((phase) => `<div class="phase ${phase.status}">${phase.number}<br>${escapeHtml(phase.name)}</div>`).join("");
        } else {
          byId("score").hidden = false;
          byId("score").textContent = `${output.score}%`;
          byId("phases").hidden = true;
          byId("lists").hidden = false;
          byId("actions").innerHTML = (output.nextActions || []).map((item, index) => `<div class="action"><strong>${index + 1}.</strong> ${escapeHtml(item)}</div>`).join("");
          byId("ready").innerHTML = list(output.ready);
          byId("missing").innerHTML = list(output.missing);
        }
      }

      document.addEventListener("click", async (event) => {
        if (!(event.target instanceof Element)) return;
        const button = event.target.closest("[data-copy]");
        if (!button) return;
        try {
          await navigator.clipboard.writeText(button.dataset.copy || "");
          button.textContent = /norwegian|norsk|bokm[aå]l|nynorsk/i.test(output?.language || "") ? "Kopiert" : "Copied";
          window.setTimeout(() => { button.textContent = button.dataset.copyLabel || "Copy"; }, 1400);
        } catch {
          button.textContent = /norwegian|norsk|bokm[aå]l|nynorsk/i.test(output?.language || "") ? "Kopiering ikke tilgjengelig" : "Copy unavailable";
        }
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (message?.jsonrpc === "2.0" && message.method === "ui/notifications/tool-result") {
          output = message.params?.structuredContent ?? output;
          render();
        }
      }, { passive: true });
      // Establish the standard MCP Apps bridge before receiving host results.
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.jsonrpc === "2.0" && event.data.id === "initialize" && event.data.result) {
          window.parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}}, "*");
        }
      });
      window.parent.postMessage({jsonrpc:"2.0",id:"initialize",method:"ui/initialize",params:{
        appInfo:{name:"music-release-manager",version:"1.2.0"},
        appCapabilities:{},protocolVersion:"2026-01-26"
      }}, "*");
      render();
    </script>
  </body>
</html>
