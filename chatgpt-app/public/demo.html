<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Release Manager Demo</title>
    <meta name="description" content="A 90-second Music Release Manager product walkthrough for artists and music teams." />
    <style>
      :root { color: #f8f4ec; background: #090909; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      main { width: min(100%, 1080px); }
      .eyebrow { color: #f4b51c; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
      h1 { margin: 12px 0 8px; font-size: 36px; }
      p { margin: 0 0 24px; color: #c8c1b6; font-size: 17px; line-height: 1.5; }
      video { display: block; width: 100%; background: #000; border: 1px solid #3b3424; border-radius: 12px; }
      footer { margin-top: 18px; color: #9f978b; font-size: 14px; line-height: 1.5; }
      @media (max-width: 640px) { body { padding: 18px; } h1 { font-size: 28px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">MUSIC RELEASE MANAGER</div>
      <h1>Product walkthrough</h1>
      <p>Release Dashboard, Artist Content Studio, Campaign Studio and Norway-aware artist support.</p>
      <video controls playsinline preload="metadata" poster="/demo/music-release-manager-poster.jpg">
        <source src="/demo/music-release-manager.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
      <footer>Planning only. No release is published and no advertising payment or launch occurs without separate approval.</footer>
    </main>
  </body>
</html>
