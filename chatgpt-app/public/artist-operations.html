<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Release Manager - Artist Operations</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px; color: #f4f1eb; background: transparent; }
      main { max-width: 760px; margin: auto; padding: 22px; border: 1px solid #403a2c; border-radius: 8px; background: #121211; box-shadow: 0 16px 45px #0004; }
      .brand { color: #f1b83c; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 4px; font-size: 25px; line-height: 1.15; }
      .sub, .note { margin: 0; color: #b9b1a6; font-size: 13px; line-height: 1.45; }
      .hero { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; margin: 18px 0; }
      .cover { display: grid; width: 96px; aspect-ratio: 1; place-items: center; overflow: hidden; border: 1px solid #665128; border-radius: 7px; background: #241b0b; color: #f3c254; font-size: 28px; font-weight: 800; }
      .cover img { width: 100%; height: 100%; object-fit: cover; }
      .status { display: inline-block; margin-top: 8px; padding: 4px 7px; border: 1px solid #756238; border-radius: 999px; color: #ecd48b; background: #2b2417; font-size: 11px; text-transform: capitalize; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .section { padding: 14px; border: 1px solid #312f29; border-radius: 7px; background: #181817; }
      .section.wide { grid-column: 1 / -1; }
      h2 { margin: 0 0 10px; color: #e9c46a; font-size: 13px; }
      .entry { display: flex; align-items: start; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid #302e29; }
      .entry:first-child { padding-top: 0; border-top: 0; }
      .label { color: #f9f5ed; font-size: 13px; font-weight: 700; }
      .meta { margin-top: 3px; color: #aaa298; font-size: 11px; line-height: 1.4; }
      .tag { flex: 0 0 auto; padding: 4px 7px; border: 1px solid #444039; border-radius: 999px; color: #c5beb2; font-size: 10px; text-transform: capitalize; }
      .tag.ready, .tag.confirmed, .tag.done { border-color: #356c50; color: #93d7ac; background: #113020; }
      .tag.missing, .tag.blocked { border-color: #854c46; color: #f0a59d; background: #351a18; }
      .tag.to-confirm, .tag.in-progress, .tag.not-started { border-color: #7a6231; color: #f2ce78; background: #302613; }
      .track-number { display: grid; flex: 0 0 24px; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #f0cb71; background: #2c2619; font-size: 11px; }
      .track { display: flex; flex: 1; gap: 9px; align-items: center; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      button, input { padding: 6px 9px; border: 1px solid #756238; border-radius: 5px; color: #f2d888; background: #282114; font: inherit; font-size: 11px; }
      input { width: 100%; }
      button { cursor: pointer; }
      button:hover { background: #3b3017; }
      button:focus-visible { outline: 2px solid #f2d888; outline-offset: 2px; }
      .copy { flex: 0 0 auto; }
      textarea { display: block; width: 100%; min-height: 180px; resize: vertical; padding: 13px; border: 1px solid #4a4438; border-radius: 6px; color: #e5ded4; background: #151514; font: inherit; font-size: 13px; line-height: 1.55; }
      textarea:focus { border-color: #d5a83a; outline: 2px solid #d5a83a55; outline-offset: 1px; }
      .message { min-height: 90px; padding: 13px; border: 1px solid #302e29; border-radius: 6px; color: #e5ded4; background: #151514; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
      .field-label { display: block; margin-bottom: 7px; color: #aaa298; font-size: 11px; font-weight: 700; }
      .helper { margin-top: 8px; color: #aaa298; font-size: 11px; line-height: 1.4; }
      .selection { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .selection-item { width: 100%; padding: 10px; border: 1px solid #3b3831; border-radius: 6px; background: #1b1a18; color: #d9d2c6; font-size: 12px; text-align: left; }
      .selection-item[aria-pressed="true"] { border-color: #b98d2d; color: #f2d17e; background: #2b2417; }
      .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .metric { padding: 10px; border: 1px solid #34312b; border-radius: 6px; background: #1a1917; }
      .metric strong { display: block; color: #faf6ee; font-size: 19px; }
      .metric span { display: block; margin-top: 4px; color: #aaa298; font-size: 11px; }
      .change { color: #9bdab0 !important; } .change.down { color: #f1aaa1 !important; }
      .bar-chart { display: grid; grid-template-columns: repeat(var(--metric-count), minmax(0, 1fr)); align-items: end; gap: 8px; height: 150px; margin-top: 16px; padding: 12px 8px 0; border-bottom: 1px solid #3c3933; }
      .bar-wrap { display: grid; grid-template-rows: 1fr auto; gap: 7px; height: 100%; text-align: center; }
      .bar { align-self: end; min-height: 7px; border-radius: 4px 4px 0 0; background: #e1ad35; }
      .bar-wrap span { overflow: hidden; color: #aaa298; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      ul { margin: 0; padding-left: 18px; color: #d8d1c7; font-size: 13px; line-height: 1.5; }
      .empty { color: #aaa298; font-size: 13px; }
      [hidden] { display: none !important; }
      @media (max-width: 560px) { body { padding: 10px; } main { padding: 17px; } .grid, .selection, .metrics { grid-template-columns: 1fr; } .hero { grid-template-columns: 72px minmax(0, 1fr); } .cover { width: 72px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" id="brand">Music Release Manager</div>
      <h1 id="title">Artist workspace</h1>
      <p class="sub" id="subtitle">Waiting for supplied details</p>
      <div id="view"></div>
      <p class="note" id="note">Planning only. Nothing is sent, submitted, saved, published, or charged.</p>
    </main>
    <script type="module">
      let output = window.openai?.toolOutput ?? null;
      const byId = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const readable = (value) => String(value || "").replace(/-/g, " ");
      const tag = (value) => `<span class="tag ${escapeHtml(value)}">${escapeHtml(readable(value))}</span>`;
      const copyButton = (value, label = "Copy") => `<button class="copy" type="button" data-copy="${escapeHtml(value)}" data-copy-label="${escapeHtml(label)}">${escapeHtml(label)}</button>`;
      const entry = (label, value, status) => `<div class="entry"><div><div class="label">${escapeHtml(label)}</div>${value ? `<div class="meta">${escapeHtml(value)}</div>` : ""}</div>${tag(status)}</div>`;
      const section = (title, content, wide = false, extra = "") => content ? `<section class="section ${wide ? "wide" : ""} ${extra}"><h2>${escapeHtml(title)}</h2>${content}</section>` : "";
      const confirmation = (items) => items?.length ? section("Confirm before use", `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`, true) : "";

      function renderReleaseCard(data) {
        byId("title").textContent = `${data.artist} - ${data.releaseTitle}`;
        byId("subtitle").textContent = [data.releaseType, data.releaseDate, data.genre].filter(Boolean).join(" · ");
        const cover = escapeHtml(data.releaseTitle.slice(0, 1).toUpperCase());
        byId("view").innerHTML = `<div class="hero"><div class="cover">${cover}</div><div><div class="label">${escapeHtml(data.artist)}</div><div class="meta">${escapeHtml(data.releaseType)}</div><span class="status">${escapeHtml(readable(data.releaseStatus))}</span></div></div><div class="grid">${section("Release milestones", (data.milestones || []).map((item) => entry(item.label, item.value, item.status)).join(""), true)}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      function renderMetadata(data) {
        byId("title").textContent = `${data.releaseTitle} - tracklist & metadata`;
        byId("subtitle").textContent = `${data.artist} · ${data.releaseType}`;
        const tracks = (data.tracks || []).map((track, index) => `<div class="entry"><div class="track"><span class="track-number">${index + 1}</span><div><div class="label">${escapeHtml(track.title)}</div><div class="meta">${escapeHtml([track.artistCredit, track.duration].filter(Boolean).join(" · "))}</div></div></div>${tag(track.status)}</div>`).join("");
        byId("view").innerHTML = `<div class="grid">${section("Tracklist", tracks, true)}${section("Metadata", (data.metadata || []).map((item) => entry(item.label, item.value, item.status)).join(""))}${section("Rights & credits", (data.rights || []).map((item) => entry(item.label, item.value, item.status)).join(""))}${section("Delivery", (data.delivery || []).map((item) => entry(item.label, item.value, item.status)).join(""), true)}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      function renderConcert(data) {
        byId("title").textContent = data.eventTitle;
        byId("subtitle").textContent = [data.artist, data.venue, data.city, data.eventDate].filter(Boolean).join(" · ");
        const details = [["Doors", data.doorsTime || "To confirm"], ["Tickets", data.ticketUrl || "No verified ticket link"], ["Ticket status", readable(data.ticketStatus)]].map(([label, value]) => `<div class="entry"><div><div class="label">${escapeHtml(label)}</div><div class="meta">${escapeHtml(value)}</div></div></div>`).join("");
        byId("view").innerHTML = `<div class="grid">${section("Event details", details)}${section("Support acts", (data.supportActs || []).length ? data.supportActs.map((name) => `<div class="entry"><div class="label">${escapeHtml(name)}</div></div>`).join("") : `<p class="empty">No support acts supplied.</p>`)}${section("Promotion next steps", (data.promotionActions || []).map((item) => `<div class="entry"><div class="label">${escapeHtml(item)}</div></div>`).join(""), true)}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      function renderPressPitch(data, state = {}) {
        byId("title").textContent = `${data.artist} - press pitch draft`;
        byId("subtitle").textContent = [readable(data.recipientType), data.releaseTitle, data.recipientName].filter(Boolean).join(" · ");
        const subject = state.subject ?? data.subject;
        const body = state.body ?? data.body;
        const followUp = data.suggestedFollowUp ? `<div class="entry"><div><div class="label">Suggested follow-up</div><div class="meta">${escapeHtml(data.suggestedFollowUp)}</div></div>${copyButton(data.suggestedFollowUp)}</div>` : "";
        byId("view").innerHTML = `<div class="grid">${section("Subject", `<label class="field-label" for="pitch-subject">Edit subject</label><input id="pitch-subject" data-field="subject" value="${escapeHtml(subject)}" />`, true)}${section("Editable draft", `<label class="field-label" for="pitch-body">Edit draft text</label><textarea id="pitch-body" data-field="body">${escapeHtml(body)}</textarea><p class="helper">Session draft only. It is not saved or sent.</p><div class="actions"><button class="copy" type="button" data-copy="" data-copy-current="press-body" data-copy-label="Copy current draft">Copy current draft</button><button type="button" data-reset="press">Reset</button></div>`, true)}${section("Follow-up", followUp, true)}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      function renderContentSelector(data, state = {}) {
        byId("title").textContent = `${data.artist} - content pack`;
        byId("subtitle").textContent = [data.releaseTitle, data.language].filter(Boolean).join(" · ");
        const labels = { "short-bio": "Short bio", "long-bio": "Long bio", "release-description": "Release description", "editorial-pitch": "Editorial pitch", "press-release": "Press release", "press-email": "Press email", "social-captions": "Social captions", "short-video-ideas": "Short video ideas", "image-briefs": "Image briefs", "youtube-description": "YouTube description" };
        const selectedItems = state.selectedItems ?? data.selectedItems;
        const notes = state.notes ?? data.notes ?? "";
        byId("view").innerHTML = `<div class="grid">${section("Select draft outputs", `<div class="selection">${Object.entries(labels).map(([id, label]) => `<button class="selection-item" type="button" data-select="${id}" aria-pressed="${selectedItems.includes(id)}">${selectedItems.includes(id) ? "Selected · " : ""}${escapeHtml(label)}</button>`).join("")}</div><p class="helper">Choose the drafts you want the artist content workspace to prepare.</p><div class="actions"><button type="button" data-reset="content-selection">Reset choices</button></div>`, true)}${section("Artist notes", `<label class="field-label" for="artist-notes">Notes for the content workspace</label><textarea id="artist-notes" data-field="notes" placeholder="Add artist-approved facts, tone or priorities...">${escapeHtml(notes)}</textarea><p class="helper">Session notes only. They are not saved or sent.</p>`, true)}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      function renderOperations(data) {
        byId("title").textContent = `${data.artist} - release operations`;
        byId("subtitle").textContent = [data.releaseTitle, data.reportingPeriod].filter(Boolean).join(" · ") || "Supplied snapshot";
        const tasks = (data.tasks || []).map((task) => `<div class="entry"><div><div class="label">${escapeHtml(task.title)}</div><div class="meta">${escapeHtml([task.owner, task.dueDate].filter(Boolean).join(" · "))}</div></div>${tag(task.status)}</div>`).join("");
        const metrics = data.metrics || [];
        const largest = Math.max(1, ...metrics.map((item) => item.value));
        const metricCards = metrics.map((item) => { const change = item.previousValue === undefined ? "" : item.value - item.previousValue; const label = change === "" ? (item.source || "Supplied") : `${change >= 0 ? "+" : ""}${change} vs previous`; return `<div class="metric"><strong>${escapeHtml(item.value.toLocaleString())}</strong><span>${escapeHtml(item.label)}</span><span class="change ${change < 0 ? "down" : ""}">${escapeHtml(label)}</span></div>`; }).join("");
        const bars = metrics.length ? `<div class="bar-chart" style="--metric-count:${metrics.length}">${metrics.map((item) => `<div class="bar-wrap"><div class="bar" style="height:${Math.max(5, (item.value / largest) * 100)}%"></div><span>${escapeHtml(item.label)}</span></div>`).join("")}</div>` : "";
        byId("view").innerHTML = `<div class="grid">${section("Release tasks", tasks || `<p class="empty">No tasks supplied.</p>`, true)}${metrics.length ? section("Supplied performance snapshot", `<div class="metrics">${metricCards}</div>${bars}`, true) : ""}${confirmation(data.confirmBeforeUse)}</div>`;
      }

      const state = { press: {}, content: {} };
      const outputKey = (data) => [data?.kind, data?.artist, data?.releaseTitle ?? ""].join("|");
      const persistedState = window.openai?.widgetState;
      if (persistedState?.key === outputKey(output)) {
        state.press = persistedState.press ?? {};
        state.content = persistedState.content ?? {};
      }
      const persistState = () => window.openai?.setWidgetState?.({ key: outputKey(output), press: state.press, content: state.content });
      const resetState = (kind) => { if (kind === "content-selection") delete state.content.selectedItems; else state[kind] = {}; persistState(); render(); };
      const activeState = (kind) => kind === "press-pitch" ? state.press : kind === "content-selector" ? state.content : {};

      function render() {
        if (!output) return;
        const handlers = { "release-card": renderReleaseCard, "metadata-checklist": renderMetadata, "concert-card": renderConcert, "press-pitch": renderPressPitch, "content-selector": renderContentSelector, "operations-snapshot": renderOperations };
        const handler = handlers[output.kind];
        if (!handler) return;
        byId("brand").textContent = output.kind.replace(/-/g, " ");
        handler(output, activeState(output.kind));
        byId("note").textContent = output.safetyNote || byId("note").textContent;
      }

      document.addEventListener("click", async (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const button = target?.closest("[data-copy]");
        if (button) { const copyValue = button.dataset.copyCurrent === "press-body" ? state.press.body ?? output?.body ?? "" : button.dataset.copy || ""; try { await navigator.clipboard.writeText(copyValue); button.textContent = "Copied"; window.setTimeout(() => { button.textContent = button.dataset.copyLabel || "Copy"; }, 1200); } catch { button.textContent = "Copy unavailable"; } return; }
        const selector = target?.closest("[data-select]");
        if (selector && output?.kind === "content-selector") { const id = selector.dataset.select; const selectedItems = new Set(state.content.selectedItems ?? output.selectedItems); if (selectedItems.has(id)) selectedItems.delete(id); else selectedItems.add(id); state.content.selectedItems = [...selectedItems]; persistState(); render(); return; }
        const reset = target?.closest("[data-reset]");
        if (reset) { resetState(reset.dataset.reset); }
      });
      document.addEventListener("input", (event) => { const field = event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement ? event.target : null; if (!field) return; if (output?.kind === "press-pitch") state.press[field.dataset.field] = field.value; if (output?.kind === "content-selector") state.content[field.dataset.field] = field.value; persistState(); });
      window.addEventListener("message", (event) => { if (event.source !== window.parent) return; const message = event.data; if (message?.jsonrpc === "2.0" && message.method === "ui/notifications/tool-result") { output = message.params?.structuredContent ?? output; state.press = {}; state.content = {}; if (window.openai?.widgetState?.key === outputKey(output)) { state.press = window.openai.widgetState.press ?? {}; state.content = window.openai.widgetState.content ?? {}; } render(); } if (message?.jsonrpc === "2.0" && message.id === "initialize" && message.result) window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*"); }, { passive: true });
      window.parent.postMessage({ jsonrpc: "2.0", id: "initialize", method: "ui/initialize", params: { appInfo: { name: "music-release-manager", version: "1.8.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" } }, "*");
      render();
    </script>
  </body>
</html>
