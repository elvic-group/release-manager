<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Release Manager - Funding workspace</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #11100e; color: #f6f1e8; }
      * { box-sizing: border-box; } body { margin: 0; padding: 18px; } main { max-width: 920px; margin: 0 auto; }
      .brand { color: #eeb745; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 6px 0 3px; font-size: clamp(24px, 5vw, 34px); line-height: 1.15; } h2 { margin: 0 0 11px; font-size: 15px; } h3 { margin: 0; color: #f5efe4; font-size: 14px; } p { margin: 0; }
      .sub, .muted, .note { color: #bcb4a8; font-size: 13px; line-height: 1.5; }.hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 20px 0 2px; }.metric { min-width: 0; padding: 13px 0; border-top: 1px solid #403b33; }.metric-label { color: #aaa194; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }.metric-value { margin-top: 5px; color: #f7f0e4; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
      .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 26px; } section { min-width: 0; padding: 18px 0; border-top: 1px solid #403b33; }.wide { grid-column: 1 / -1; }.items { display: grid; gap: 0; }.item, .field, .step { padding: 13px 0; border-top: 1px solid #2d2a24; }.item:first-child, .field:first-child, .step:first-child { padding-top: 0; border-top: 0; }.row { display: flex; align-items: start; justify-content: space-between; gap: 12px; }.details { margin-top: 6px; color: #c8c0b5; font-size: 13px; line-height: 1.5; }.small { margin-top: 6px; color: #aaa194; font-size: 11px; line-height: 1.45; }
      .tag { display: inline-flex; flex: 0 0 auto; align-items: center; padding: 3px 6px; border-radius: 3px; background: #28251f; color: #d9c27d; font-size: 10px; font-weight: 750; line-height: 1.2; text-transform: uppercase; }.tag.available { color: #9ed3ad; background: #17291c; }.tag.needs-review, .tag.not-checked { color: #e9bf75; background: #322817; } ul { margin: 0; padding-left: 18px; color: #d7cfc3; font-size: 13px; line-height: 1.55; }.action-list { display: grid; gap: 10px; }.step-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: #aaa194; font-size: 11px; line-height: 1.35; }.field-label { color: #d8cebf; font-size: 12px; font-weight: 800; }.field-value { margin-top: 6px; color: #f2ece1; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
      a, button { color: #f1c65e; } a { text-underline-offset: 3px; }.link { display: inline-flex; margin-top: 9px; font-size: 12px; font-weight: 700; } button { margin-top: 8px; padding: 5px 8px; border: 1px solid #7c6430; border-radius: 4px; background: #282114; font: inherit; font-size: 11px; cursor: pointer; }button:hover { background: #3b3017; }button:focus-visible, a:focus-visible { outline: 2px solid #f2d888; outline-offset: 2px; }.notice { padding: 14px 0; border-top: 1px solid #403b33; color: #c8c0b5; font-size: 13px; line-height: 1.55; }.empty { color: #aaa194; font-size: 13px; }@media (max-width: 620px) { body { padding: 14px; } .hero, .layout { grid-template-columns: 1fr; gap: 0; } .hero { margin-bottom: 14px; } .metric { padding: 11px 0; } }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>
      let output = window.openai?.toolOutput ?? null;
      const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const words = (value) => String(value || "").replace(/-/g, " ");
      const tag = (value) => `<span class="tag ${esc(value)}">${esc(words(value))}</span>`;
      const list = (items, empty) => items?.length ? `<ul>${items.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : `<p class="empty">${esc(empty)}</p>`;
      const officialLink = (url, label = "Open official source") => url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label)}</a>` : "";
      const copy = (value, label) => `<button type="button" data-copy="${esc(value)}">${esc(label)}</button>`;

      function renderMatch(data) {
        const programs = data.opportunities || [];
        document.getElementById("app").innerHTML = `<div class="brand">Music Release Manager</div><h1>Funding options</h1><p class="sub">${esc(data.artistName || "Artist")} · ${esc(data.projectTitle || "Project planning")}</p><div class="hero"><div class="metric"><div class="metric-label">Artist profile</div><div class="metric-value">${esc(data.profileSummary || "To confirm")}</div></div><div class="metric"><div class="metric-label">Catalog results</div><div class="metric-value">${esc(programs.length)}</div></div><div class="metric"><div class="metric-label">Result state</div><div class="metric-value">Possible options only</div></div></div><div class="layout"><section><h2>Possible options</h2><div class="items">${programs.length ? programs.map((program) => `<article class="item"><div class="row"><h3>${esc(program.name)}</h3>${tag(program.sourceStatus)}</div><p class="small">${esc(program.funder)} · ${esc(words(program.scope))} · checked ${esc(program.lastSourceCheckAt ? new Date(program.lastSourceCheckAt).toLocaleDateString() : "not yet")}</p><p class="details">${esc(program.summary)}</p><p class="small">${esc((program.fitReasons || []).join(" "))}</p>${officialLink(program.officialUrl)}</article>`).join("") : `<p class="empty">No current candidates from the maintained catalog match this profile. Use the directory below to look for regional and municipal options.</p>`}</div></section><section><h2>Check before applying</h2><p class="details">${esc(data.currentInfoNote || "Confirm the official source before treating an option as eligible.")}</p><p class="notice">${esc(data.safetyNote || "Recommendations are planning support only. This workspace does not submit an application or claim that a deadline is open.")}</p></section><section class="wide"><h2>Next actions</h2><div class="action-list">${(data.nextActions || []).map((item) => `<div class="step"><p class="details">${esc(item)}</p></div>`).join("")}</div>${data.directory ? `${officialLink(data.directory.url, `Browse ${data.directory.name}`)}<p class="small">${esc(data.directory.description)}</p>` : ""}</section></div>`;
      }

      function renderWorkspace(data) {
        const opportunity = data.opportunity || {};
        document.getElementById("app").innerHTML = `<div class="brand">Music Release Manager</div><h1>Funding application workspace</h1><p class="sub">${esc(data.artistName || "Artist")} · ${esc(data.projectTitle || "Project")}</p><div class="hero"><div class="metric"><div class="metric-label">Selected opportunity</div><div class="metric-value">${esc(opportunity.name || "To confirm")}</div></div><div class="metric"><div class="metric-label">Funder</div><div class="metric-value">${esc(opportunity.funder || "To confirm")}</div></div><div class="metric"><div class="metric-label">State</div><div class="metric-value">Draft preparation only</div></div></div><div class="layout"><section><h2>Official source</h2><p class="details">${esc(opportunity.summary || "Open the official source and confirm the current rules before preparing an application.")}</p>${officialLink(opportunity.officialUrl)}<p class="notice">${esc(data.currentInfoNote || "Current eligibility and deadlines must be verified directly with the funder.")}</p></section><section><h2>Eligibility to verify</h2>${list(data.eligibilityToVerify, "Check all eligibility conditions with the funder.")}</section><section class="wide"><h2>Application readiness</h2><div class="action-list">${(data.applicationSteps || []).map((step) => `<div class="step"><div class="row"><h3>${esc(step.title)}</h3>${tag(step.status)}</div><p class="details">${esc(step.action)}</p><p class="small">Evidence: ${esc(step.evidence)}</p></div>`).join("")}</div></section><section><h2>Draft fields</h2><div class="items">${(data.formFields || []).map((field) => `<div class="field"><div class="field-label">${esc(field.label)}</div><p class="field-value">${esc(field.value || "Add after checking the official application form.")}</p>${copy(field.value || "", "Copy draft")}</div>`).join("")}</div></section><section><h2>Documents</h2>${list(data.requiredDocuments, "Check the official application form for required documentation.")}${data.knownDocuments?.length ? `<p class="small">Already available: ${esc(data.knownDocuments.join(", "))}</p>` : ""}</section></div><p class="notice">${esc(data.safetyNote || "This workspace creates drafts only. It does not submit applications, send documents or make funding decisions.")}</p>`;
      }
      function render() { const app = document.getElementById("app"); if (!output) { app.innerHTML = `<p class="muted">Funding options or an application workspace will appear here.</p>`; return; } if (output.kind === "funding-match") return renderMatch(output); if (output.kind === "funding-application-workspace") return renderWorkspace(output); app.innerHTML = `<p class="muted">This result cannot be shown in the funding workspace.</p>`; }
      document.addEventListener("click", async (event) => { const button = event.target.closest("[data-copy]"); if (!button) return; try { await navigator.clipboard.writeText(button.dataset.copy || ""); button.textContent = "Copied"; setTimeout(() => { button.textContent = "Copy draft"; }, 1200); } catch { button.textContent = "Copy unavailable"; } });
      window.addEventListener("message", (event) => { if (event.source !== window.parent) return; const message = event.data; if (message?.jsonrpc === "2.0" && message.method === "ui/notifications/tool-result") { output = message.params?.structuredContent ?? output; render(); } if (message?.jsonrpc === "2.0" && message.id === "initialize" && message.result) window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*"); }, { passive: true });
      window.parent.postMessage({ jsonrpc: "2.0", id: "initialize", method: "ui/initialize", params: { appInfo: { name: "music-release-manager", version: "1.8.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" } }, "*"); render();
    </script>
  </body>
</html>
